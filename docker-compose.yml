services:
  db:
    image: postgres:16-alpine
    container_name: orvexa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orvexa
      POSTGRES_USER: orvexa
      POSTGRES_PASSWORD: orvexa
    ports:
      - '5433:5432'
    volumes:
      - orvexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orvexa -d orvexa']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: orvexa_adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: orvexa_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - orvexa_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orvexa_pgdata:
  orvexa_redisdata:
