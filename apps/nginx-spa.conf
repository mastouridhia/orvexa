# Minimal SPA config used inside each frontend container.
# Front-facing reverse proxy (deploy/nginx/) handles TLS, hosts, and HSTS.
server {
    listen      80 default_server;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Static assets served by Vite get content-hashed filenames, so they're
    # safely cacheable for a year. The HTML shell must always be fresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires    0;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|gif|ico)$ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hide nginx version. Defense-in-depth — front proxy also strips it.
    server_tokens off;
}
