<script type="__bundler/template">
    "<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"utf-8\">\n  <title>TableFlow — DMOS<\u002Ftitle>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    html, body { margin: 0; padding: 0; background: #f0eee9; height: 100%; }\n    body { font-family: -apple-system, system-ui, sans-serif; }\n  <\u002Fstyle>\n\n  <script src=\"3fa7243b-b38b-4c55-bb5e-f31fdafa2910\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"ae31cb8a-e32d-46d2-9c4e-57d70a069150\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"c81bdccf-5917-4c50-986e-a847f17ac149\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n<\u002Fhead>\n<body>\n  <div id=\"root\"><\u002Fdiv>\n  \n\n  <script type=\"text/babel\" src=\"86ac6995-67a6-4dd5-a6b7-7d5abd0b0dce\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"de099a0e-1262-4477-8887-6daefb86b619\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"0cf1bc4e-e243-4bf6-93a6-6d7e9b5580fc\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"967cfa93-3f9f-4d8a-bcd5-49dfc727718e\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"910dc393-8919-4449-a39c-7c1e3a59b794\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"2b62ac08-3466-46ed-9237-377d25fdda41\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"9dce0947-9586-47e4-a84f-924b7310b3db\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"2f1b0e00-1ed5-4428-8ec8-d83a4bea8768\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"50feb862-710b-4cc2-9482-2c75ee4b5d78\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"025d2990-7edd-492f-951d-f054ed30c408\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"409f3ae4-6306-4736-8357-43bf52f5cf36\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"c61cd6e3-e3dd-4064-b64f-2cef496fd291\"><\u002Fscript>\n  <script type=\"text/babel\" src=\"85e7fb61-5b04-4d7b-afa3-de39809f2fde\"><\u002Fscript>\n\n  <script type=\"text/babel\">\n    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n      \"accentHue\": 360,\n      \"showAllScreens\": true,\n      \"showSystem\": true,\n      \"showMoodboards\": true,\n      \"showKitchen\": true,\n      \"showWall\": true,\n      \"showWaiter\": true,\n      \"showAdmin\": true,\n      \"showStates\": true\n    }/*EDITMODE-END*/;\n\n    function Root() {\n      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);\n\n      // Live accent override — saffron promoted to CSS custom properties.\n      React.useEffect(() => {\n        const r = document.documentElement;\n        const c    = `oklch(0.68 0.15 ${t.accentHue})`;\n        const cInk = `oklch(0.40 0.12 ${t.accentHue})`;\n        const cBg  = `oklch(0.93 0.06 ${t.accentHue})`;\n        r.style.setProperty('--tf-accent', c);\n        r.style.setProperty('--tf-accent-ink', cInk);\n        r.style.setProperty('--tf-accent-bg', cBg);\n        r.style.setProperty('--tf-accent-glow', `oklch(0.68 0.15 ${t.accentHue} / 0.32)`);\n      }, [t.accentHue]);\n\n      return (\n        <>\n          <DesignCanvas>\n            {t.showSystem && (\n              <DCSection id=\"system\" title=\"Design system\" subtitle=\"Tokens · type · color · spacing · components\">\n                <DCArtboard id=\"cover\" label=\"00 · Cover\" width={1280} height={800}><SysCover /><\u002FDCArtboard>\n                <DCArtboard id=\"color\" label=\"01 · Color\" width={1280} height={800}><SysColor /><\u002FDCArtboard>\n                <DCArtboard id=\"type\" label=\"02 · Type\" width={1280} height={800}><SysType /><\u002FDCArtboard>\n                <DCArtboard id=\"space\" label=\"03 · Spacing · radius · shadow · motion\" width={1280} height={800}><SysSpace /><\u002FDCArtboard>\n                <DCArtboard id=\"components\" label=\"04 · Components\" width={1280} height={800}><SysComponents /><\u002FDCArtboard>\n              <\u002FDCSection>\n            )}\n\n            {t.showMoodboards && (\n              <DCSection id=\"moods\" title=\"Directional moodboards\" subtitle=\"Three options. Saffron / hospitality-soft selected — see prototype below.\">\n                <DCArtboard id=\"a\" label=\"A · Editorial / warm-minimal\" width={420} height={620}><MoodEditorial /><\u002FDCArtboard>\n                <DCArtboard id=\"b\" label=\"B · Tech-crisp / linear-coded\" width={420} height={620}><MoodTech /><\u002FDCArtboard>\n                <DCArtboard id=\"c\" label=\"C · Saffron · hospitality-soft  ← chosen\" width={420} height={620}><MoodHospitality /><\u002FDCArtboard>\n              <\u002FDCSection>\n            )}\n\n            <DCSection id=\"customer\" title=\"Customer app · interactive prototype\" subtitle=\"Tap any screen to use it. Browse → item → cart → tracking → waiter → bill.\">\n              <DCArtboard id=\"proto\" label=\"01 · Live prototype  ↳  start here\" width={402} height={874}>\n                <CustomerApp />\n              <\u002FDCArtboard>\n              {t.showAllScreens && <DCArtboard id=\"menu\" label=\"02 · Menu\" width={402} height={874}><StaticMenuScreen /><\u002FDCArtboard>}\n              {t.showAllScreens && <DCArtboard id=\"item\" label=\"03 · Item detail\" width={402} height={874}><StaticItemScreen /><\u002FDCArtboard>}\n              {t.showAllScreens && <DCArtboard id=\"cart\" label=\"04 · Cart sheet\" width={402} height={874}><StaticCartScreen /><\u002FDCArtboard>}\n              {t.showAllScreens && <DCArtboard id=\"track\" label=\"05 · Order tracking\" width={402} height={874}><StaticTrackingScreen /><\u002FDCArtboard>}\n              {t.showAllScreens && <DCArtboard id=\"waiter\" label=\"06 · Call waiter — confirmed\" width={402} height={874}><StaticWaiterScreen /><\u002FDCArtboard>}\n              {t.showAllScreens && <DCArtboard id=\"bill\" label=\"07 · Bill\" width={402} height={874}><StaticBillScreen /><\u002FDCArtboard>}\n            <\u002FDCSection>\n\n            {t.showKitchen && (\n              <DCSection id=\"kitchen\" title=\"Kitchen Display · operator surface\" subtitle=\"Live ticket simulation. Press-and-hold to bump. Aging cards, course pacing, station load. AR + FR.\">\n                <DCArtboard id=\"kds-tablet\" label=\"01 · Tablet KDS · 1366×1024 · live\" width={1366} height={1024}>\n                  <TabletKDS width={1366} height={1024} />\n                <\u002FDCArtboard>\n                {t.showWall && (\n                  <DCArtboard id=\"kds-wall\" label=\"02 · Wall display · 1920×1080 · high-glance\" width={1920} height={1080}>\n                    <WallDisplay width={1920} height={1080} />\n                  <\u002FDCArtboard>\n                )}\n              <\u002FDCSection>\n            )}\n\n            {t.showWaiter && (\n              <DCSection id=\"waiter\" title=\"Waiter app · phone\" subtitle=\"Yassine, mid-shift. Floor map with breathing tables, oldest-first call queue, per-table order assist.\">\n                <DCArtboard id=\"w-app\" label=\"01 · Live prototype · tap a table\" width={402} height={874}>\n                  <WaiterApp />\n                <\u002FDCArtboard>\n                <DCArtboard id=\"w-floor\" label=\"02 · Floor map\" width={402} height={874}>\n                  <WaiterAppStatic tab=\"floor\" />\n                <\u002FDCArtboard>\n                <DCArtboard id=\"w-calls\" label=\"03 · Call queue\" width={402} height={874}>\n                  <WaiterAppStatic tab=\"calls\" />\n                <\u002FDCArtboard>\n                <DCArtboard id=\"w-detail\" label=\"04 · Table detail (cooking)\" width={402} height={874}>\n                  <WaiterAppStatic tab=\"floor\" detailTable={14} />\n                <\u002FDCArtboard>\n              <\u002FDCSection>\n            )}\n\n            {t.showAdmin && (\n              <DCSection id=\"admin\" title=\"Admin dashboard · desktop\" subtitle=\"Owner view. Today's pulse, menu performance, staff, and a live right-now feed.\">\n                <DCArtboard id=\"adm-overview\" label=\"01 · Overview\" width={1440} height={900}>\n                  <AdminDashboard />\n                <\u002FDCArtboard>\n              <\u002FDCSection>\n            )}\n\n            {t.showStates && (\n              <DCSection id=\"states\" title=\"Empty / loading / error states\" subtitle=\"Engineer handoff. Drop these in for the non-happy paths — every screen real apps live or die in.\">\n                <DCArtboard id=\"st-cust-loading\" label=\"Customer · menu loading\" width={402} height={874}><CustomerMenuLoading /><\u002FDCArtboard>\n                <DCArtboard id=\"st-cust-empty\" label=\"Customer · empty cart\" width={402} height={874}><CustomerEmptyCart /><\u002FDCArtboard>\n                <DCArtboard id=\"st-cust-net\" label=\"Customer · network error\" width={402} height={874}><CustomerNetworkError /><\u002FDCArtboard>\n                <DCArtboard id=\"st-cust-pay\" label=\"Customer · payment failed\" width={402} height={874}><CustomerPaymentFailed /><\u002FDCArtboard>\n                <DCArtboard id=\"st-cust-conf\" label=\"Customer · order confirmed\" width={402} height={874}><CustomerOrderConfirmedFull /><\u002FDCArtboard>\n                <DCArtboard id=\"st-w-empty\" label=\"Waiter · empty queue\" width={402} height={874}><WaiterEmptyCalls /><\u002FDCArtboard>\n                <DCArtboard id=\"st-w-shift\" label=\"Waiter · shift start\" width={402} height={874}><WaiterShiftStart /><\u002FDCArtboard>\n                <DCArtboard id=\"st-k-empty\" label=\"Kitchen · all caught up\" width={1366} height={1024}><KitchenEmptyQueue /><\u002FDCArtboard>\n                <DCArtboard id=\"st-k-off\" label=\"Kitchen · offline\" width={1366} height={1024}><KitchenOffline /><\u002FDCArtboard>\n                <DCArtboard id=\"st-a-loading\" label=\"Admin · loading\" width={1440} height={900}><AdminLoading /><\u002FDCArtboard>\n                <DCArtboard id=\"st-a-closed\" label=\"Admin · closed day\" width={1440} height={900}><AdminEmptyDay /><\u002FDCArtboard>\n              <\u002FDCSection>\n            )}\n\n            <DCSection id=\"next\" title=\"Next steps\" subtitle=\"Once you sign off, I'll commit this direction across the four operator surfaces.\">\n              <DCArtboard id=\"roadmap\" label=\"Roadmap\" width={1280} height={420}>\n                <RoadmapScreen />\n              <\u002FDCArtboard>\n            <\u002FDCSection>\n\n            <DCPostIt top={120} left={20} rotate={-3}>\n              Two big questions for you →<br/><br/>\n              1. Hue — saffron #D97A2C feels right for North-Africa-coded warmth without going terracotta. Try the slider in Tweaks?<br/><br/>\n              2. RTL — when ready, I'll layer Arabic + logical CSS properties. Same components.\n            <\u002FDCPostIt>\n          <\u002FDesignCanvas>\n\n          <TweaksPanel title=\"Tweaks · DMOS\">\n            <TweakSection label=\"Accent\" />\n            <TweakSlider label=\"Hue\" min={0} max={360} step={1} unit=\"°\" value={t.accentHue} onChange={(v) => setTweak('accentHue', v)} />\n            <TweakSection label=\"Visibility\" />\n            <TweakToggle label=\"Design system\" value={t.showSystem} onChange={(v) => setTweak('showSystem', v)} />\n            <TweakToggle label=\"Moodboards\" value={t.showMoodboards} onChange={(v) => setTweak('showMoodboards', v)} />\n            <TweakToggle label=\"Static customer screens\" value={t.showAllScreens} onChange={(v) => setTweak('showAllScreens', v)} />\n            <TweakToggle label=\"Kitchen Display\" value={t.showKitchen} onChange={(v) => setTweak('showKitchen', v)} />\n            <TweakToggle label=\"Wall display variant\" value={t.showWall} onChange={(v) => setTweak('showWall', v)} />\n            <TweakToggle label=\"Waiter app\" value={t.showWaiter} onChange={(v) => setTweak('showWaiter', v)} />\n            <TweakToggle label=\"Admin dashboard\" value={t.showAdmin} onChange={(v) => setTweak('showAdmin', v)} />\n            <TweakToggle label=\"Empty/error/loading states\" value={t.showStates} onChange={(v) => setTweak('showStates', v)} />\n          <\u002FTweaksPanel>\n        <\u002F>\n      );\n    }\n\n    // ── Static-screen wrappers ───────────────────────────────────────────────\n    // Each renders one customer-app screen in isolation, prepopulated with a\n    // realistic order so the empty state isn't shown on the design canvas.\n\n    const SAMPLE_CART = [\n      { id: 'm4', qty: 1 },\n      { id: 'm6', qty: 1 },\n      { id: 'm9', qty: 2 },\n      { id: 'm12', qty: 2 },\n    ];\n    const sampleItems = SAMPLE_CART.map((c) => ({ ...c, item: TF_MENU.items.find((i) => i.id === c.id) }));\n    const sampleTotal = sampleItems.reduce((s, c) => s + c.qty * c.item.price, 0);\n\n    function StaticMenuScreen() {\n      const [cat, setCat] = React.useState('mains');\n      const [search, setSearch] = React.useState('');\n      const items = TF_MENU.items.filter((i) => cat === 'all' || i.cat === cat);\n      return (\n        <div style={{ width: '100%', height: '100%', position: 'relative' }}>\n          <MenuScreen cat={cat} setCat={setCat} items={items} onItem={() => {}} search={search} setSearch={setSearch} orderState={null} onTracking={() => {}} />\n          <CartFab count={3} total={66.500} onClick={() => {}} />\n        <\u002Fdiv>\n      );\n    }\n\n    function StaticItemScreen() {\n      const item = TF_MENU.items.find((i) => i.id === 'm4');\n      return <ItemSheet item={item} onClose={() => {}} onAdd={() => {}} />;\n    }\n\n    function StaticCartScreen() {\n      return (\n        <div style={{ position: 'relative', width: '100%', height: '100%', background: '#FAF8F4' }}>\n          <div style={{ position: 'absolute', inset: 0, opacity: 0.4, background: '#FAF8F4', filter: 'blur(2px)' }}>\n            <StaticMenuScreen />\n          <\u002Fdiv>\n          <CartSheet items={sampleItems} total={sampleTotal} onClose={() => {}} setQty={() => {}} onPlace={() => {}} />\n        <\u002Fdiv>\n      );\n    }\n    function StaticTrackingScreen() {\n      return <TrackingScreen orderState=\"preparing\" items={sampleItems} total={sampleTotal} onBack={() => {}} onWaiter={() => {}} onBill={() => {}} />;\n    }\n    function StaticWaiterScreen() {\n      return <WaiterScreen state=\"ack\" onCall={() => {}} onClose={() => {}} />;\n    }\n    function StaticBillScreen() {\n      return <BillScreen items={sampleItems} total={sampleTotal} requested={false} onRequest={() => {}} onClose={() => {}} />;\n    }\n\n    function RoadmapScreen() {\n      const phases = [\n        { id: '01', name: 'Customer app', detail: 'Menu · item · cart · tracking · waiter · bill', state: 'In review' },\n        { id: '02', name: 'Landing', detail: 'Hero · features · pricing · CTA — operator-facing', state: 'Next' },\n        { id: '03', name: 'Kitchen Display', detail: 'Tablet KDS · dense · color-coded · 8–12 tickets', state: 'Queued' },\n        { id: '04', name: 'Waiter handheld', detail: 'Floor map · table states · notif feed · pulse-on-call', state: 'Queued' },\n        { id: '05', name: 'Admin', detail: 'Menu CRUD · staff · analytics · Linear-coded density', state: 'Queued' },\n        { id: '06', name: 'Localization', detail: 'RTL · Arabic · French · logical CSS props', state: 'Throughout' },\n      ];\n      return (\n        <div className=\"tf\" style={{ width: '100%', height: '100%', background: '#FAF8F4', padding: 56, display: 'flex', flexDirection: 'column' }}>\n          <div className=\"tf-mono\" style={{ fontSize: 11, letterSpacing: 1.4, textTransform: 'uppercase', color: 'rgba(25,20,14,0.4)', marginBottom: 14 }}>05 · Next<\u002Fdiv>\n          <h2 style={{ fontSize: 36, fontWeight: 500, letterSpacing: -1, margin: 0, marginBottom: 24 }}>\n            What I'd build next, after sign-off.\n          <\u002Fh2>\n          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, flex: 1 }}>\n            {phases.map((p) => (\n              <div key={p.id} style={{ padding: 20, background: '#fff', borderRadius: 14, border: `1px solid ${SYS_LINE}`, display: 'flex', flexDirection: 'column' }}>\n                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>\n                  <span className=\"tf-mono\" style={{ fontSize: 11, color: 'rgba(25,20,14,0.5)', letterSpacing: 1.2 }}>{p.id}<\u002Fspan>\n                  <span className=\"tf-mono\" style={{ fontSize: 11, color: p.state === 'In review' ? '#7C3F12' : 'rgba(25,20,14,0.5)', letterSpacing: 1.2, textTransform: 'uppercase' }}>{p.state}<\u002Fspan>\n                <\u002Fdiv>\n                <div style={{ fontSize: 22, fontWeight: 500, letterSpacing: -0.4, marginBottom: 6 }}>{p.name}<\u002Fdiv>\n                <div style={{ fontSize: 13, color: 'rgba(25,20,14,0.6)', lineHeight: 1.5 }}>{p.detail}<\u002Fdiv>\n              <\u002Fdiv>\n            ))}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      );\n    }\n\n    Object.assign(window, {\n      StaticMenuScreen, StaticItemScreen, StaticCartScreen,\n      StaticTrackingScreen, StaticWaiterScreen, StaticBillScreen, RoadmapScreen,\n    });\n\n    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
      </script>
    </body>
    </html>
