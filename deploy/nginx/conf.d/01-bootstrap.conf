# Always-on HTTP listener.
# - Serves ACME challenges from /var/www/certbot (used by `certbot --webroot`).
# - Redirects everything else to HTTPS — but only if certs already exist
#   (the redirect is harmless before certs: clients won't reach this until DNS
#   resolves, and once it does, the operator runs init-certs to provision).
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 challenge: do not redirect, do not log.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Health probe for the proxy itself (used by docker healthcheck).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else: redirect to HTTPS. Before certs exist, leave the redirect
    # in place — the user is expected to run init-certs.sh before exposing the
    # service to real users, and the bootstrap window should be brief.
    location / {
        return 301 https://$host$request_uri;
    }
}
