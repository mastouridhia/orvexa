# ── api.tableflow.tn → api (with WebSocket upgrade) ─────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.tableflow.tn;

    ssl_certificate     /etc/letsencrypt/live/api.tableflow.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tableflow.tn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Image uploads can hit ~5MB.
    client_max_body_size 6m;

    location / {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Socket.io upgrade.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Long polling + websocket need generous read timeouts.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
