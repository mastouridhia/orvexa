# Full HTTPS config — activated by deploy/scripts/init-certs.sh after certbot
# successfully provisions a cert for ${PRIMARY_DOMAIN}.
#
# Hostname assumptions (search/replace `tableflow.tn` to deploy under a different domain):
#   tableflow.tn          → customer  (QR-scan target — kept short for printability)
#   www.tableflow.tn      → customer  (canonical redirect to apex)
#   kitchen.tableflow.tn  → kitchen
#   waiter.tableflow.tn   → waiter
#   admin.tableflow.tn    → admin
#   api.tableflow.tn      → api  (with WebSocket upgrade for socket.io)

# ── Shared TLS settings ─────────────────────────────────────────────
# Modern config from Mozilla SSL Configuration Generator (intermediate profile).
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;

# ── Map: WebSocket upgrade ──────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── www.tableflow.tn → tableflow.tn ─────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.tableflow.tn;

    ssl_certificate     /etc/letsencrypt/live/tableflow.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tableflow.tn/privkey.pem;

    return 301 https://tableflow.tn$request_uri;
}

# ── tableflow.tn → customer ─────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name tableflow.tn;

    ssl_certificate     /etc/letsencrypt/live/tableflow.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tableflow.tn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://customer:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── kitchen / waiter / admin ────────────────────────────────────────
# Same template repeated per host; kept inline rather than via include
# so each cert path is explicit and a misconfiguration fails loud.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name kitchen.tableflow.tn;

    ssl_certificate     /etc/letsencrypt/live/kitchen.tableflow.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.tableflow.tn/privkey.pem;

