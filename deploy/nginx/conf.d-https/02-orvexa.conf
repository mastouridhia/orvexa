# Full HTTPS config — activated by deploy/scripts/init-certs.sh after certbot
# successfully provisions a cert for ${PRIMARY_DOMAIN}.
#
# Hostname assumptions (search/replace `orvexa.tn` to deploy under a different domain):
#   orvexa.tn          → customer  (QR-scan target — kept short for printability)
#   www.orvexa.tn      → landing   (marketing landing page)
#   kitchen.orvexa.tn  → kitchen
#   waiter.orvexa.tn   → waiter
#   admin.orvexa.tn    → admin
#   api.orvexa.tn      → api  (with WebSocket upgrade for socket.io)

# ── Docker DNS resolver — re-resolve upstream hostnames every 30s ───
# Without this, Nginx caches container IPs at startup. When containers are
# recreated their IPs change, causing Nginx to route to the wrong backends
# until the proxy is restarted. 127.0.0.11 is Docker's embedded DNS server.
resolver 127.0.0.11 valid=30s ipv6=off;

# ── Shared TLS settings ─────────────────────────────────────────────
# Modern config from Mozilla SSL Configuration Generator (intermediate profile).
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;

# ── Map: WebSocket upgrade ──────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── www.orvexa.tn → landing page ─────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.orvexa.tn;

    ssl_certificate     /etc/letsencrypt/live/orvexa.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvexa.tn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.orvexa.tn; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none';" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

    location / {
        set $upstream http://landing:80;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── orvexa.tn → landing (apex root + marketing pages) + customer ──
# The apex is the printed-QR target, so QR paths (/t/{token}, /m/{slug}) and the
# customer SPA MUST keep working here. We only carve out the marketing landing's
# own paths (root, plans/terms/privacy, its css + logo) and send them to the
# landing container; everything else falls through to the customer app. The
# landing needs its own (looser) CSP because its pages use inline scripts
# (onclick pricing toggle) and inline styles, which the customer CSP forbids.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name orvexa.tn;

    ssl_certificate     /etc/letsencrypt/live/orvexa.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvexa.tn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.orvexa.tn; connect-src 'self' https://api.orvexa.tn wss://api.orvexa.tn; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

    # Marketing landing: apex root + its standalone pages/assets only. A regex
    # location so one block covers them all; '?' makes the group optional so it
    # also matches '/'. Regex wins over the plain 'location /' prefix below, and
    # the customer's hashed /assets/*.js never match (only orvexa-mark.svg does).
    location ~ ^/(plans\.html|terms\.html|privacy\.html|colors_and_type\.css|assets/orvexa-mark\.svg)?$ {
        # Location-level add_header drops server-level headers, so re-state them all.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.orvexa.tn; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none';" always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

        set $upstream http://landing:80;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream http://customer:80;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

