user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compact log line. Front-proxy log is the auditable layer; app containers
    # log to stdout and `docker compose logs -f` is enough for the rest.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Larger upstream header buffers — JWTs in Authorization headers can be ~1KB.
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    # Image upload route allows up to 5MB (matches UPLOADS_MAX_BYTES on the API).
    client_max_body_size 6m;

    # gzip on the proxy: HTML/JSON/JS/CSS only — images already compressed.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml application/rss+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
